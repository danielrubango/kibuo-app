class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { noteOpen: false };
  }
  renderVals() {
    var self = this;
    var n = this.state.noteOpen;
    return {
      noteLines: n ? 'unset' : '3',
      noteCta: n ? 'Réduire' : 'Lire toute la note',
      toggleNote: function () { self.setState({ noteOpen: !self.state.noteOpen }); }
    };

}
