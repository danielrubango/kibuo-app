<style>body{margin:0}

.row+.row{border-top:1px solid #EEF1F7}

.sw{width:48px;height:28px;border-radius:14px;border:0;padding:0;position:relative;cursor:pointer;flex:none}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 28 }; }
  renderVals() {
    var self = this, t = this.state.t;
    if (t > 0 && !this.timer) { this.timer = setTimeout(function () { self.timer = null; self.setState({ t: self.state.t - 1 }); }, 1000); }

  }
}
