<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Premier lancement, langue</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 24px 16px; position: relative; overflow: hidden; background: #EEF1F7; color: #0E1320; font-family: Inter, sans-serif; display: flex; flex-direction: column">
  <svg viewBox="0 0 96 96" width="88" height="88" aria-hidden="true"><rect width="96" height="96" rx="22" fill="#0E1320"></rect><circle cx="48" cy="48" r="25" fill="#5EEAB5"></circle><path d="M42 35A10 10 0 1 1 54 35Z" fill="#FFC247" stroke="#0E1320" stroke-width="2.5"></path><path d="M45 28.5h6" stroke="#0E1320" stroke-width="1.8" stroke-linecap="round" opacity="0.45"></path><rect x="37" y="35" width="22" height="5" rx="2.5" fill="#0E1320"></rect></svg>
  <h1 style="margin: 32px 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 32px; line-height: 38px; font-weight: 700">Bienvenue sur Kibuo</h1>
  <p style="margin: 0 0 32px; font-size: 16px; line-height: 24px; color: #525D73">Vos comptes, vos dettes et vos projets, au même endroit. Vos données restent sur votre téléphone.</p>
  <h2 style="margin: 0 0 12px; font-size: 15px; font-weight: 600">Choisissez votre langue</h2>
  <div style="display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto">
    <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
      <button type="button" onClick="{{l.pick}}" aria-pressed="{{l.on}}" style="height: 60px; border-radius: 16px; background: #FFFFFF; border: 2px solid {{l.line}}; padding: 0 16px; color: #0E1320; font: 500 16px Inter, sans-serif; text-align: left">{{l.label}}</button>
    </sc-for>
  </div>
  <a href="Lancement2.dc.html" style="height: 56px; border-radius: 18px; background: #5EEAB5; color: #0E1320; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Continuer</a><a href="RestauNeuf.dc.html" style="min-height: 48px; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #0A7355; font-size: 15px; font-weight: 600; text-decoration: none"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5"></path></svg>J’ai une sauvegarde</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'Français' };
  }
  renderVals() {
    var self = this;
    return {
      langs: ['Français', 'English'].map(function (l) {
        var on = self.state.lang === l;
        return { label: l, on: on, line: on ? '#0A7355' : '#FFFFFF', pick: function () { self.setState({ lang: l }); } };
      })
    };
  }
}
</script>
</body>
</html>
