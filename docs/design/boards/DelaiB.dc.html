<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Délai · B · une ligne, le choix dans une feuille</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>body{margin:0}
.key{width:80px;height:60px;border:0;border-radius:20px;background:#FFFFFF;color:#0E1320;font:500 26px 'Space Grotesk',sans-serif;cursor:pointer}
.key.empty{background:transparent;cursor:default}
.key:disabled{color:#B6BDCB;background:#E4E8F0;cursor:default}
.primary{width:100%;min-height:52px;border:0;border-radius:16px;background:#5EEAB5;color:#0E1320;font:600 16px Inter,sans-serif;cursor:pointer}
.primary.off{background:#DDE2EC;color:#8A93A6;cursor:default}
.ghost{min-height:44px;border:0;background:transparent;font:600 15px Inter,sans-serif;color:#0A7355;cursor:pointer}
.chip{min-width:72px;min-height:48px;border-radius:14px;border:1.5px solid #C9CFDB;background:#FFFFFF;font:600 18px 'Space Grotesk',sans-serif;color:#0E1320;cursor:pointer}
.chip[aria-pressed="true"]{border-color:#0E1320;background:#0E1320;color:#FFFFFF}
.card{background:#FFFFFF;border-radius:18px;padding:2px 16px;display:flex;flex-direction:column}
.row{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#0E1320;font-size:16px;text-decoration:none}
.row+.row{border-top:1px solid #EEF1F7}
.help{font-size:13px;line-height:18px;color:#525D73;padding:0 4px}
.sw{width:48px;height:28px;border-radius:14px;border:0;padding:0;position:relative;cursor:pointer;flex:none}
.sw span{position:absolute;top:3px;width:22px;height:22px;border-radius:11px;background:#FFFFFF;box-shadow:0 1px 2px rgba(14,19,32,.25)}
.note{font-size:12px;font-weight:600;color:#525D73;border:1px dashed #C9CFDB;border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.6)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; overflow: hidden; position: relative; background: #EEF1F7; color: #0E1320; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: stretch; gap: 14px"><header style="display: flex; align-items: center; gap: 4px; height: 44px; align-self: stretch"><button type="button" aria-label="Retour" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#0E1320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Verrouillage</h1></header><div class="card"><a class="row" href="PinCreaC2.dc.html"><span>Modifier le code</span><span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #525D73">4 chiffres<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8A93A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span></a><div class="row"><span>Empreinte</span><button type="button" class="sw" role="switch" aria-checked="{{fingerOn}}" onClick="{{fingerToggle}}" style="background: {{fingerBg}}"><span style="left: {{fingerX}}"></span></button></div><div class="row"><span>Clavier mélangé</span><button type="button" class="sw" role="switch" aria-checked="{{shuffleOn}}" onClick="{{shuffleToggle}}" style="background: {{shuffleBg}}"><span style="left: {{shuffleX}}"></span></button></div><button type="button" class="row" onClick="{{openSheet}}" style="border: 0; border-top: 1px solid #EEF1F7; background: transparent; padding: 0; width: 100%; font: 400 16px Inter, sans-serif; color: #0E1320; cursor: pointer"><span>Verrouiller après</span><span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #525D73">{{value}}<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8A93A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span></button></div><p class="help">Le clavier mélangé change la place des chiffres à chaque fois : un regard par-dessus l’épaule ne suffit pas à deviner le code.</p><div class="card" style="margin-top: 8px"><button type="button" class="row" style="border: 0; background: transparent; padding: 0; font: 500 16px Inter, sans-serif; color: #B3321A">Retirer le code</button></div><p class="help">Sans code, Kibuo s’ouvre directement. Vos données restent chiffrées.</p><div style="display: {{sheet}}; position: absolute; inset: 0; flex-direction: column; justify-content: flex-end"><div onClick="{{closeSheet}}" style="position: absolute; inset: 0; background: rgba(14,19,32,0.45)"></div><section style="position: relative; background: #EEF1F7; border-radius: 24px 24px 0 0; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 12px"><span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #B6BDCB"></span><h2 style="margin: 4px 4px 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Verrouiller après une absence de</h2><div class="card"><sc-for list="{{opts}}" as="o" hint-placeholder-count="5"><button type="button" class="row" onClick="{{o.pick}}" style="border: 0; border-top: 1px solid #EEF1F7; background: transparent; padding: 0; width: 100%; font: 400 16px Inter, sans-serif; color: #0E1320; cursor: pointer"><span>{{o.long}}</span><span style="visibility: {{o.check}}; color: #0A7355; font-size: 18px">✓</span></button></sc-for></div></section></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { finger: true, shuffle: true, delay: 2, open: false }; }
  renderVals() {
    var self = this, s = this.state, v = {};
    v.fingerOn = String(s.finger); v.fingerBg = s.finger ? '#0A7355' : '#C9CFDB'; v.fingerX = s.finger ? '23px' : '3px'; v.fingerToggle = function () { self.setState({ finger: !self.state.finger }); };
    v.shuffleOn = String(s.shuffle); v.shuffleBg = s.shuffle ? '#0A7355' : '#C9CFDB'; v.shuffleX = s.shuffle ? '23px' : '3px'; v.shuffleToggle = function () { self.setState({ shuffle: !self.state.shuffle }); };
    var short = ["Aussitôt", "30 s", "1 min", "5 min", "15 min"], long = ["Aussitôt", "30 secondes", "1 minute", "5 minutes", "15 minutes"];
    v.value = long[s.delay];
    v.opts = short.map(function (l, i) { return { label: l, long: long[i], on: String(i === s.delay), check: i === s.delay ? 'visible' : 'hidden',
      pick: function () { self.setState({ delay: i, open: false }); } }; });
    v.openSheet = function () { self.setState({ open: true }); };
    v.closeSheet = function () { self.setState({ open: false }); };
    v.sheet = s.open ? 'flex' : 'none';
    v.pct = (s.delay / 4 * 100) + '%';
    v.minus = function () { self.setState({ delay: Math.max(0, s.delay - 1) }); };
    v.plus = function () { self.setState({ delay: Math.min(4, s.delay + 1) }); };
    return v;
  }
}
</script>
</body>
</html>
