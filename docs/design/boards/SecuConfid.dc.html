<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Confidentialité</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>body{margin:0}
.key{width:80px;height:60px;border:0;border-radius:20px;background:#FFFFFF;color:#0E1320;font:500 26px 'Space Grotesk',sans-serif;cursor:pointer}
.key.empty{background:transparent;cursor:default}
.key:disabled{color:#B6BDCB;background:#E4E8F0;cursor:default}
.primary{width:100%;min-height:52px;border:0;border-radius:16px;background:#5EEAB5;color:#0E1320;font:600 16px Inter,sans-serif;cursor:pointer}
.primary.off{background:#DDE2EC;color:#8A93A6;cursor:default}
.ghost{min-height:44px;border:0;background:transparent;font:600 15px Inter,sans-serif;color:#0A7355;cursor:pointer}
.chip{min-width:72px;min-height:48px;border-radius:14px;border:1.5px solid #C9CFDB;background:#FFFFFF;font:600 18px 'Space Grotesk',sans-serif;color:#0E1320;cursor:pointer}
.chip[aria-pressed="true"]{border-color:#0E1320;background:#0E1320;color:#FFFFFF}
.card{background:#FFFFFF;border-radius:18px;padding:2px 16px;display:flex;flex-direction:column}
.row{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#0E1320;font-size:16px;text-decoration:none}
.row+.row{border-top:1px solid #EEF1F7}
.help{font-size:13px;line-height:18px;color:#525D73;padding:0 4px}
.sw{width:48px;height:28px;border-radius:14px;border:0;padding:0;position:relative;cursor:pointer;flex:none}
.sw span{position:absolute;top:3px;width:22px;height:22px;border-radius:11px;background:#FFFFFF;box-shadow:0 1px 2px rgba(14,19,32,.25)}
.note{font-size:12px;font-weight:600;color:#525D73;border:1px dashed #C9CFDB;border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.6)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; overflow: hidden; position: relative; background: #EEF1F7; color: #0E1320; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: stretch; gap: 14px"><header style="display: flex; align-items: center; gap: 4px; height: 44px; align-self: stretch"><button type="button" aria-label="Retour" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#0E1320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Confidentialité</h1></header><div class="card"><div class="row"><span style="flex: 1">Masquer Kibuo dans les applications récentes</span><button type="button" class="sw" role="switch" aria-checked="{{recentsOn}}" onClick="{{recentsToggle}}" style="background: {{recentsBg}}"><span style="left: {{recentsX}}"></span></button></div><div class="row"><span style="flex: 1">Autoriser les captures d’écran</span><button type="button" class="sw" role="switch" aria-checked="{{shotsOn}}" onClick="{{shotsToggle}}" style="background: {{shotsBg}}"><span style="left: {{shotsX}}"></span></button></div></div><p class="help">Masqué, l’aperçu des applications récentes montre le logo de Kibuo au lieu de vos soldes.</p></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { recents: true, shots: true, old: false }; }
  renderVals() {
    var self = this, s = this.state, v = {};
    v.recentsOn = String(s.recents); v.recentsBg = s.recents ? '#0A7355' : '#C9CFDB'; v.recentsX = s.recents ? '23px' : '3px'; v.recentsToggle = function () { self.setState({ recents: !self.state.recents }); };
    v.shotsOn = String(s.shots); v.shotsBg = s.shots ? '#0A7355' : '#C9CFDB'; v.shotsX = s.shots ? '23px' : '3px'; v.shotsToggle = function () { self.setState({ shots: !self.state.shots }); };
    v.oldNote = s.old ? 'block' : 'none'; v.noteToggle = 'inline-block';
    v.old = function () { self.setState({ old: !self.state.old }); };
    return v;
  }
}
</script>
</body>
</html>
