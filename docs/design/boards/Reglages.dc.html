<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Réglages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; overflow: hidden; background: #EEF1F7; color: #0E1320; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <header style="display: flex; align-items: center; gap: 4px; height: 44px">
    <a href="Aujourdhui.dc.html" aria-label="Retour à l'accueil" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0E1320">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Réglages</h1>
  </header>
  <sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; padding-left: 4px; font-size: 13px; font-weight: 600; color: #525D73">{{s.title}}</h2>
      <div style="background: #FFFFFF; border-radius: 18px; padding: 2px 16px; display: flex; flex-direction: column">
        <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
          <a href="{{r.href}}" style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #0E1320; font-size: 16px"><span>{{r.label}}</span><span style="font-size: 14px; color: #525D73">{{r.value}}</span></a>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      sections: [
        { title: 'Général', rows: [
          { label: 'Langue', value: 'Français', href: 'ReglageLangue.dc.html' },
          { label: 'Comptes', value: '5', href: 'Comptes.dc.html' },
          { label: 'Types de compte', value: '4', href: 'TypeCompte.dc.html' },
          { label: 'Devises', value: 'USD', href: 'Devises.dc.html' },
          { label: 'Catégories', value: '', href: 'Categories.dc.html' },
          { label: 'Début du mois', value: 'Le 1er', href: 'ReglageDebutMois.dc.html' },
          { label: 'Récurrences et brouillons', value: 'Automatique', href: 'ReglagesBrouillons.dc.html' }
        ] },
        { title: 'Notifications', rows: [
          { label: 'Rappels et alertes', value: '', href: 'Rappels.dc.html' }
        ] },
        { title: 'Sécurité', rows: [
          { label: 'PIN et biométrie', value: 'Activé', href: 'Verrou.dc.html' },
          { label: 'Code de récupération', value: '', href: 'CodeRecup.dc.html' }
        ] },
        { title: 'Données', rows: [
          { label: 'Sauvegarde et restauration', value: '', href: 'Sauvegarde.dc.html' },
          { label: 'Exporter en CSV', value: '', href: 'ExportCSV.dc.html' }
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
