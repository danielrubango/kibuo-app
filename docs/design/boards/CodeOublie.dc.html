<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Code oublié</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>body{margin:0}
.key{width:80px;height:60px;border:0;border-radius:20px;background:#FFFFFF;color:#0E1320;font:500 26px 'Space Grotesk',sans-serif;cursor:pointer}
.key.empty{background:transparent;cursor:default}
.key:disabled{color:#B6BDCB;background:#E4E8F0;cursor:default}
.primary{width:100%;min-height:52px;border:0;border-radius:16px;background:#5EEAB5;color:#0E1320;font:600 16px Inter,sans-serif;cursor:pointer}
.primary.off{background:#DDE2EC;color:#8A93A6;cursor:default}
.ghost{min-height:44px;border:0;background:transparent;font:600 15px Inter,sans-serif;color:#0A7355;cursor:pointer}
.chip{min-width:72px;min-height:48px;border-radius:14px;border:1.5px solid #C9CFDB;background:#FFFFFF;font:600 18px 'Space Grotesk',sans-serif;color:#0E1320;cursor:pointer}
.chip[aria-pressed="true"]{border-color:#0E1320;background:#0E1320;color:#FFFFFF}
.card{background:#FFFFFF;border-radius:18px;padding:2px 16px;display:flex;flex-direction:column}
.row{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#0E1320;font-size:16px;text-decoration:none}
.row+.row{border-top:1px solid #EEF1F7}
.help{font-size:13px;line-height:18px;color:#525D73;padding:0 4px}
.sw{width:48px;height:28px;border-radius:14px;border:0;padding:0;position:relative;cursor:pointer;flex:none}
.sw span{position:absolute;top:3px;width:22px;height:22px;border-radius:11px;background:#FFFFFF;box-shadow:0 1px 2px rgba(14,19,32,.25)}
.note{font-size:12px;font-weight:600;color:#525D73;border:1px dashed #C9CFDB;border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.6)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 0; overflow: hidden; position: relative; background: #EEF1F7; color: #0E1320; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: stretch; gap: 14px"><div style="position: absolute; inset: 0; padding: 64px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 16px; opacity: 0.5"><svg viewBox="0 0 96 96" width="56" height="56" aria-hidden="true"><rect width="96" height="96" rx="22" fill="#0E1320"></rect><circle cx="48" cy="48" r="25" fill="#5EEAB5"></circle><path d="M42 35A10 10 0 1 1 54 35Z" fill="#FFC247" stroke="#0E1320" stroke-width="2.5"></path><path d="M45 28.5h6" stroke="#0E1320" stroke-width="1.8" stroke-linecap="round" opacity="0.45"></path><rect x="37" y="35" width="22" height="5" rx="2.5" fill="#0E1320"></rect></svg><h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Entrez votre code</h1></div><div style="position: absolute; inset: 0; background: rgba(14,19,32,0.45)"></div><section style="position: absolute; left: 0; right: 0; bottom: 0; background: #EEF1F7; border-radius: 24px 24px 0 0; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 12px"><span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #B6BDCB"></span><h2 style="margin: 4px 4px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Code oublié ?</h2><div class="card"><button type="button" class="row" style="border: 0; background: transparent; padding: 0; text-align: left; font: 500 16px Inter, sans-serif">Utiliser l’empreinte<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8A93A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button><a class="row" href="RecupSaisie.dc.html" style="text-decoration: none">Utiliser le code de récupération<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8A93A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a></div><div style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px"><strong style="font-size: 16px; color: #B3321A">Effacer et repartir de zéro</strong><p style="margin: 0; font-size: 14px; line-height: 20px; color: #525D73">Toutes les données de Kibuo sur ce téléphone seront effacées. Vous pourrez ensuite restaurer une sauvegarde, si vous en avez une.</p><button type="button" onClick="{{down}}" style="position: relative; overflow: hidden; min-height: 48px; border-radius: 14px; border: 1.5px solid #B3321A; background: #FFFFFF; color: #B3321A; font: 600 15px Inter, sans-serif; cursor: pointer"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{fill}}; background: #FBE3DE; transition: width {{speed}} linear"></span><span style="position: relative">{{label}}</span></button></div></section></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { holding: false, done: false }; }
  renderVals() {
    var self = this, s = this.state;
    return {
      fill: s.holding || s.done ? '100%' : '0%', speed: s.holding ? '1.2s' : '0.2s',
      label: s.done ? 'Effacé (maquette)' : 'Maintenir pour effacer',
      // On the phone the button must be held 1.2 s; here a tap plays the fill.
      down: function () { if (s.done) { self.setState({ done: false }); return; } self.setState({ holding: true }); setTimeout(function () { self.setState({ done: true, holding: false }); }, 1200); }
    };
  }
}
</script>
</body>
</html>
