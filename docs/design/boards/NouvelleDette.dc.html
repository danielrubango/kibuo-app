<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouvelle dette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; position: relative; background: #EEF1F7; color: #0E1320; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 12px">
  <header style="display: flex; align-items: center; gap: 4px; height: 44px">
    <a href="DettesCartes.dc.html" aria-label="Retour aux dettes et créances" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0E1320"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Nouvelle entrée</h1>
  </header>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #FFFFFF; border-radius: 16px; padding: 4px">
    <sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
      <button type="button" onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="height: 44px; border: 0; border-radius: 12px; font: 600 14px Inter, sans-serif; background: {{k.bg}}; color: {{k.fg}}">{{k.label}}</button>
    </sc-for>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="personne" style="font-size: 14px; font-weight: 600">{{personLabel}}</label>
    <input id="personne" type="text" value="Patrick" style="height: 52px; box-sizing: border-box; border: 0; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font: 400 16px Inter, sans-serif; color: #0E1320">
  </div>
  <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="montant-dette" style="font-size: 14px; font-weight: 600">Montant</label>
      <input id="montant-dette" type="text" inputmode="decimal" value="200,00" style="height: 52px; box-sizing: border-box; border: 0; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font: 400 16px Inter, sans-serif; color: #0E1320">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="devise-dette" style="font-size: 14px; font-weight: 600">Devise</label>
      <select id="devise-dette" style="height: 52px; box-sizing: border-box; border: 0; border-radius: 14px; background: #FFFFFF; padding: 0 10px; font: 400 16px Inter, sans-serif; color: #0E1320"><option>USD</option><option>CDF</option></select>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="echeance" style="font-size: 14px; font-weight: 600">Échéance</label>
    <input id="echeance" type="text" value="5 décembre 2026" style="height: 52px; box-sizing: border-box; border: 0; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font: 400 16px Inter, sans-serif; color: #0E1320">
  </div>
  <section style="background: #FFFFFF; border-radius: 18px; padding: 4px 16px; display: flex; flex-direction: column">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
      <div style="min-height: 60px; display: flex; align-items: center; gap: 12px">
        <div style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">{{o.title}}</span><span style="font-size: 13px; color: #525D73">{{o.help}}</span></div>
        <button type="button" onClick="{{o.toggle}}" aria-pressed="{{o.on}}" aria-label="{{o.title}}" style="width: 52px; height: 44px; flex: 0 0 52px; border: 0; background: transparent; padding: 0; display: flex; align-items: center"><span style="width: 52px; height: 32px; border-radius: 16px; background: {{o.track}}; display: flex; align-items: center; justify-content: {{o.side}}; padding: 0 3px; box-sizing: border-box"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF"></span></span></button>
      </div>
    </sc-for>
  </section>
  <button type="button" style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 54px; border: 0; border-radius: 18px; background: #5EEAB5; color: #0E1320; font: 600 16px Inter, sans-serif">Enregistrer</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'owe', link: true, remind: true };
  }
  renderVals() {
    var self = this;
    var owe = this.state.kind === 'owe';
    var make = function (key, title, help) {
      var on = self.state[key];
      return { title: title, help: help, on: on, track: on ? '#0A7355' : '#8A93A6', side: on ? 'flex-end' : 'flex-start', toggle: function () { var s = {}; s[key] = !self.state[key]; self.setState(s); } };
    };
    return {
      kinds: [{ id: 'owe', label: 'Je dois' }, { id: 'owed', label: 'On me doit' }].map(function (k) {
        var on = self.state.kind === k.id;
        return { label: k.label, on: on, bg: on ? '#0E1320' : 'transparent', fg: on ? '#FFFFFF' : '#0E1320', pick: function () { self.setState({ kind: k.id }); } };
      }),
      personLabel: owe ? 'À qui je dois' : 'Qui me doit',
      opts: [
        make('link', owe ? 'Argent reçu sur un compte' : 'Argent sorti d\'un compte', 'M-Pesa, le solde sera mis à jour'),
        make('remind', 'Rappel', '2 jours avant l\'échéance')
      ]
    };
  }
}
</script>
</body>
</html>
