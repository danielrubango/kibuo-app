<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Saisir le code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>body{margin:0}
.key{width:80px;height:60px;border:0;border-radius:20px;background:#FFFFFF;color:#0E1320;font:500 26px 'Space Grotesk',sans-serif;cursor:pointer}
.key.empty{background:transparent;cursor:default}
.key:disabled{color:#B6BDCB;background:#E4E8F0;cursor:default}
.primary{width:100%;min-height:52px;border:0;border-radius:16px;background:#5EEAB5;color:#0E1320;font:600 16px Inter,sans-serif;cursor:pointer}
.primary.off{background:#DDE2EC;color:#8A93A6;cursor:default}
.ghost{min-height:44px;border:0;background:transparent;font:600 15px Inter,sans-serif;color:#0A7355;cursor:pointer}
.chip{min-width:72px;min-height:48px;border-radius:14px;border:1.5px solid #C9CFDB;background:#FFFFFF;font:600 18px 'Space Grotesk',sans-serif;color:#0E1320;cursor:pointer}
.chip[aria-pressed="true"]{border-color:#0E1320;background:#0E1320;color:#FFFFFF}
.card{background:#FFFFFF;border-radius:18px;padding:2px 16px;display:flex;flex-direction:column}
.row{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#0E1320;font-size:16px;text-decoration:none}
.row+.row{border-top:1px solid #EEF1F7}
.help{font-size:13px;line-height:18px;color:#525D73;padding:0 4px}
.sw{width:48px;height:28px;border-radius:14px;border:0;padding:0;position:relative;cursor:pointer;flex:none}
.sw span{position:absolute;top:3px;width:22px;height:22px;border-radius:11px;background:#FFFFFF;box-shadow:0 1px 2px rgba(14,19,32,.25)}
.note{font-size:12px;font-weight:600;color:#525D73;border:1px dashed #C9CFDB;border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.6)}
</style>
<style>
.grp{width:72px;height:56px;box-sizing:border-box;border-radius:12px;background:#FFFFFF;border:2px solid #B6BDCB;display:flex;align-items:center;justify-content:center;font:600 20px 'Space Grotesk',sans-serif;letter-spacing:2px;color:#0E1320}
.grp.cur{border-color:#0A7355}
.grp.err{border-color:#B3321A}
.secondary{width:100%;min-height:52px;border-radius:16px;border:1.5px solid #C9CFDB;background:#FFFFFF;color:#0E1320;font:600 16px Inter,sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; overflow: hidden; position: relative; background: #EEF1F7; color: #0E1320; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: stretch; gap: 14px"><header style="display: flex; align-items: center; gap: 4px; height: 44px; align-self: stretch"><button type="button" aria-label="Retour" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#0E1320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Code de récupération</h1></header><div style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 24px; text-align: center"><span style="width: 64px; height: 64px; border-radius: 20px; background: #D5F2E4; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#0A7355" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l8-8M16 7l2 2M14 9l2 2"></path></svg></span><h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Saisissez votre code de récupération</h2><p style="margin: 0; font-size: 14px; line-height: 20px; color: {{subColor}}; max-width: 300px">{{sub}}</p></div><div style="margin-top: 8px; display: flex; gap: 8px; justify-content: center"><sc-for list="{{boxes}}" as="b" hint-placeholder-count="4"><span class="{{b.cls}}">{{b.v}}</span></sc-for></div><p class="help" style="text-align: center">Les tirets et les minuscules ne comptent pas.</p><div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 24px"><button type="button" class="primary" onClick="{{toggle}}">Ouvrir Kibuo</button></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { err: false }; }
  renderVals() {
    var self = this, s = this.state, cls = s.err ? 'err' : '';
    var vals = ['KB7Q', '4M2X', '9TPA', 'H3W'];
    var boxes = vals.map(function (v, i) { return { v: v, cls: 'grp ' + (s.err ? 'err' : (i === 3 ? 'cur' : '')) }; });
    return {
      boxes: boxes,
      sub: s.err ? 'Code incorrect. Vérifiez chaque groupe et réessayez.' : 'Le code de 16 caractères remis à sa création, en 4 groupes.',
      subColor: s.err ? '#B3321A' : '#525D73',
      toggle: function () { self.setState({ err: !self.state.err }); }
    };
  }
}
</script>
</body>
</html>
