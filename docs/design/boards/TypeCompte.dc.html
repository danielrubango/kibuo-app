<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouveau type de compte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; position: relative; background: #EEF1F7; color: #0E1320; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <header style="display: flex; align-items: center; gap: 4px; height: 44px">
    <a href="Reglages.dc.html" aria-label="Retour aux réglages" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0E1320"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Nouveau type</h1>
  </header>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="nom-type" style="font-size: 14px; font-weight: 600">Nom</label>
    <input id="nom-type" type="text" value="Tontine" style="height: 52px; box-sizing: border-box; border: 0; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font: 400 16px Inter, sans-serif; color: #0E1320">
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 14px; font-weight: 600">Icône</h2>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{icons}}" as="i" hint-placeholder-count="12">
        <button type="button" onClick="{{i.pick}}" aria-pressed="{{i.on}}" aria-label="{{i.label}}" style="height: 48px; border: 0; border-radius: 14px; padding: 0; display: flex; align-items: center; justify-content: center; background: {{i.bg}}; color: {{i.fg}}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"></path></svg></button>
      </sc-for>
    </div>
  </div>
  <button type="button" style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 54px; border: 0; border-radius: 18px; background: #5EEAB5; color: #0E1320; font: 600 16px Inter, sans-serif">Enregistrer</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  constructor(props) {
    super(props);
    this.state = { icon: 'Groupe' };
  }
  renderVals() {
    var self = this;
    var all = [
      { label: 'Portefeuille', d: 'M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H3zM3 7l12-3v3M17 13h.01' },
      { label: 'Banque', d: 'M3 10l9-6 9 6M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18' },
      { label: 'Téléphone', d: 'M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM11 18h2' },
      { label: 'Pièce', d: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v10M9 9.5h4.5a2 2 0 0 1 0 4H10' },
      { label: 'Carte', d: 'M3 6h18v12H3zM3 10h18' },
      { label: 'Maison', d: 'M3 11l9-8 9 8v10H3z' },
      { label: 'Travail', d: 'M4 8h16v11H4zM9 8V5h6v3' },
      { label: 'Cadeau', d: 'M4 10h16v10H4zM2 7h20v3H2zM12 7v13' },
      { label: 'Groupe', d: 'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20c0-3 3-5 6-5s6 2 6 5M16 5a3 3 0 0 1 0 6M18 15c2 1 3 2 3 5' },
      { label: 'Cadenas', d: 'M6 11h12v9H6zM9 11V8a3 3 0 0 1 6 0v3' },
      { label: 'Étoile', d: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z' },
      { label: 'Monde', d: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18' }
    ];
    return {
      icons: all.map(function (i) {
        var sel = self.state.icon === i.label;
        return { label: i.label, d: i.d, on: sel, bg: sel ? '#0E1320' : '#FFFFFF', fg: sel ? '#FFFFFF' : '#0E1320', pick: function () { self.setState({ icon: i.label }); } };
      })
    };
  }
}
</script>
</body>
</html>
