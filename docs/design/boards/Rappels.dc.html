<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rappels et alertes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; overflow: hidden; background: #EEF1F7; color: #0E1320; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <header style="display: flex; align-items: center; gap: 4px; height: 44px">
    <a href="Reglages.dc.html" aria-label="Retour aux réglages" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0E1320">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Rappels et alertes</h1>
  </header>

  <sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; padding-left: 4px; font-size: 13px; font-weight: 600; color: #525D73">{{s.title}}</h2>
      <div style="background: #FFFFFF; border-radius: 18px; padding: 4px 16px; display: flex; flex-direction: column">
        <sc-for list="{{s.rows}}" as="o" hint-placeholder-count="2">
          <div style="min-height: 60px; display: flex; align-items: center; gap: 12px">
            <div style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">{{o.title}}</span><span style="font-size: 13px; color: #525D73">{{o.help}}</span></div>
            <button type="button" onClick="{{o.toggle}}" aria-pressed="{{o.on}}" aria-label="{{o.title}}" style="width: 52px; height: 44px; flex: 0 0 52px; border: 0; background: transparent; padding: 0; display: flex; align-items: center"><span style="width: 52px; height: 32px; border-radius: 16px; background: {{o.track}}; display: flex; align-items: center; justify-content: {{o.side}}; padding: 0 3px; box-sizing: border-box"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF"></span></span></button>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-for>

  <p style="margin: 0 4px; font-size: 14px; line-height: 20px; color: #525D73">Chaque dette, créance, projet ou récurrence peut avoir son propre rappel, réglé dans sa fiche.</p>

  <a href="#" style="min-height: 44px; display: flex; align-items: center; padding: 0 4px; font-size: 14px; font-weight: 600; color: #0A7355; text-decoration: none">Notifications en retard ? Voir le guide de réglage</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { daily: true, dueDefault: true, b80: true, b100: true };
  }
  renderVals() {
    var self = this;
    var make = function (key, title, help) {
      var on = self.state[key];
      return { title: title, help: help, on: on, track: on ? '#0A7355' : '#8A93A6', side: on ? 'flex-end' : 'flex-start', toggle: function () { var s = {}; s[key] = !self.state[key]; self.setState(s); } };
    };
    return {
      sections: [
        { title: 'Saisie', rows: [make('daily', 'Noter mes opérations', 'Chaque jour à 20:00')] },
        { title: 'Échéances', rows: [make('dueDefault', 'Rappeler par défaut', '2 jours avant chaque échéance')] },
        { title: 'Budgets', rows: [
          make('b80', 'À 80 % du budget', 'Une alerte par catégorie'),
          make('b100', 'À 100 % du budget', 'Une alerte par catégorie')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
