name: kibuo
description: "Kibuo, a simple offline budgeting companion."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  cryptography: ^2.9.0
  drift: ^2.35.4
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  image_picker: ^1.2.4
  intl: any
  local_auth: ^3.0.2
  open_filex: ^5.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfx: ^2.11.0
  sqlite3: ^3.9.1
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  # French and English texts, from lib/l10n/*.arb.
  generate: true

  # Bundled so the app never fetches fonts from the internet (offline first).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    # Only for the name « Kibuo » next to the logo (docs/design/BRAND.md).
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: PhosphorRegular
      fonts:
        - asset: assets/icons/Phosphor.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/icons/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/icons/Phosphor-Fill.ttf

# The database engine is built with encryption (SQLite3 Multiple Ciphers);
# see docs/adr/0010-moteur-de-chiffrement.md.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
